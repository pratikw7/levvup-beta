<ion-app>
  <ion-menu contentId="main-content" type="overlay" id="m1">
    <ion-header>
      <ion-toolbar>
        <ion-title>LEVVUP</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <!-- Test Ionic button -->
        <ion-button expand="block" color="success" style="margin: 10px 20px;">
          Ionic Button Test
        </ion-button>

        <ion-item button (click)="navigateTo('/home')">
          <ion-icon name="home" slot="start"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/add-task')">
          <ion-icon name="add" slot="start"></ion-icon>
          <ion-label>Add task</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/history')">
          <ion-icon name="list" slot="start"></ion-icon>
          <ion-label>All tasks</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/friends')">
          <ion-icon name="people" slot="start"></ion-icon>
          <ion-label>Friends</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/groups')">
          <ion-icon name="people-circle" slot="start"></ion-icon>
          <ion-label>Groups</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/achievements')">
          <ion-icon name="trophy" slot="start"></ion-icon>
          <ion-label>Achievements</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/help')">
          <ion-icon name="help-circle" slot="start"></ion-icon>
          <ion-label>Help</ion-label>
        </ion-item>

        <ion-item button (click)="navigateTo('/settings')">
          <ion-icon name="settings" slot="start"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-item>

        <ion-item button (click)="onLogout()">
          <ion-icon name="exit" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content" main></ion-router-outlet>
</ion-app>
